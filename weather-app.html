<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Green-Cyan Weather UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00c9a7, #00b3ec);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .phone {
      width: 420px;
      max-width: 95%;
      background: #000;
      border-radius: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeInUp 0.7s ease forwards;
      margin-top: 30px;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .phone::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 10%, rgba(0,255,200,0.15), transparent 60%);
      pointer-events: none;
    }
    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 15px; }
    .search-bar {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .search-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #222;
      color: #fff;
      font-size: 0.95rem;
    }
    .search-bar button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #00c9a7;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .search-bar button:hover { background: #00b3ec; transform: scale(1.05); }
    .autocomplete {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 5px;
      z-index: 999;
      display: none;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #333;
    }
    .suggestion {
      padding: 8px 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .suggestion:hover { background: #222; }
    .auto-loc-btn {
      margin-top: 10px;
      background: #222;
      color: #fff;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .auto-loc-btn:hover { background: #333; transform: scale(1.05); }
    .current-weather { text-align: center; padding: 20px; position: relative; }
    .weather-icon { font-size: 4rem; margin-bottom: 10px; }
    .temp { font-size: 2.5rem; font-weight: 600; margin-bottom: 5px; }
    .conditions { font-size: 1rem; opacity: 0.8; margin-bottom: 10px; }
    .range { font-size: 0.9rem; opacity: 0.7; }
    .more-info { margin-top: 10px; font-size: 0.9rem; opacity: 0.9; line-height: 1.4; }
    .library-btn {
      margin-top: 15px;
      background: #00c9a7;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .library-btn:hover { background: #00b3ec; transform: scale(1.05); }
    .hourly-forecast { padding: 15px 20px; }
    .hourly-forecast h2 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; }
    .hourly-cards {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .hourly-cards::-webkit-scrollbar { display: none; }
    .hourly-card {
      min-width: 60px;
      background: #111;
      border-radius: 10px;
      text-align: center;
      padding: 8px;
      flex-shrink: 0;
    }
    .hourly-card .hour { font-weight: 600; margin-bottom: 4px; font-size: 0.8rem; }
    .hourly-card .icon { font-size: 1.2rem; margin-bottom: 4px; }
    .hourly-card .temp { font-size: 0.8rem; }
    .forecast { padding: 15px 20px; }
    .forecast h2 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; }
    .forecast-cards {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .forecast-cards::-webkit-scrollbar { display: none; }
    .day-card {
      min-width: 70px;
      background: #111;
      border-radius: 10px;
      text-align: center;
      padding: 10px;
      flex-shrink: 0;
    }
    .day-card .day { font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
    .day-card .icon { font-size: 1.5rem; margin-bottom: 5px; }
    .day-card .temps { font-size: 0.8rem; }
    .extra-info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 15px 20px 25px;
    }
    .info-card {
      flex: 1 1 calc(50% - 5px);
      background: #111;
      border-radius: 10px;
      text-align: center;
      padding: 15px;
    }
    .info-card p { font-size: 0.85rem; margin-bottom: 5px; font-weight: 600; }
    .info-card span { font-size: 0.9rem; opacity: 0.8; }
    .library { padding: 0 20px 20px; }
    .library h2 { font-size: 1rem; font-weight: 600; margin-bottom: 10px; }
    #savedCitiesList {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .saved-city {
      background: #111;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .saved-city:hover { background: #222; }
    .remove-btn {
      background: transparent;
      color: #ff6b6b;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
    }
    .remove-btn:hover { color: #ff3b3b; }
    .error { color: #ff6b6b; font-weight: 600; margin-top: 10px; text-align: center; }
    .loading { font-size: 1rem; margin-top: 10px; opacity: 0.8; text-align: center; }
    .footer { text-align: center; font-size: 0.8rem; color: #777; padding: 10px 0; }
    @media (max-width: 400px) {
      .phone { border-radius: 20px; }
      header h1 { font-size: 1.3rem; }
      .temp { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <h1>Weather Forecast</h1>
      <div class="search-bar">
        <input type="text" id="cityInput" placeholder="Search city..."/>
        <button id="searchBtn">Go</button>
        <div class="autocomplete" id="autocomplete"></div>
      </div>
      <button class="auto-loc-btn" id="autoLocBtn">Use Auto-Location</button>
    </header>
    <div class="current-weather" id="currentWeather"></div>
    <div class="hourly-forecast" id="hourlyForecast"></div>
    <div class="forecast">
      <h2>7-Days Forecast</h2>
      <div class="forecast-cards" id="forecastCards"></div>
    </div>
    <div class="extra-info">
      <div class="info-card">
        <p>Sunrise</p>
        <span id="sunriseTime">--:--</span>
      </div>
      <div class="info-card">
        <p>Sunset</p>
        <span id="sunsetTime">--:--</span>
      </div>
      <div class="info-card">
        <p>UV Index</p>
        <span id="uvIndex">--</span>
      </div>
      <div class="info-card">
        <p>Air Quality</p>
        <span id="airQuality">N/A</span>
      </div>
    </div>
    <div class="library">
      <h2>Saved Cities</h2>
      <div id="savedCitiesList"></div>
    </div>
    <div class="footer">© RYNx86. All Rights Reserved. Built with love.</div>
  </div>
  <script>
    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const autoLocBtn = document.getElementById("autoLocBtn");
    const autocompleteEl = document.getElementById("autocomplete");
    const currentWeatherEl = document.getElementById("currentWeather");
    const forecastCardsEl = document.getElementById("forecastCards");
    const hourlyForecastEl = document.getElementById("hourlyForecast");
    const sunriseTimeEl = document.getElementById("sunriseTime");
    const sunsetTimeEl = document.getElementById("sunsetTime");
    const uvIndexEl = document.getElementById("uvIndex");
    const airQualityEl = document.getElementById("airQuality");
    const savedCitiesListEl = document.getElementById("savedCitiesList");
    let savedCities = JSON.parse(localStorage.getItem("savedCities")) || [];
    let debounceTimer = null;
    const dayWeatherIcons = {
      0:"☀️", 1:"🌤", 2:"⛅️", 3:"☁️", 45:"🌫", 48:"🌫", 51:"🌧", 53:"🌧", 55:"🌧",
      56:"🌧❄️", 57:"🌧❄️", 61:"🌧", 63:"🌧", 65:"🌧", 66:"🌧❄️", 67:"🌧❄️",
      71:"❄️", 73:"❄️", 75:"❄️", 77:"❄️", 80:"🌧", 81:"🌧", 82:"🌧",
      85:"❄️", 86:"❄️", 95:"⛈", 96:"⛈❄️", 99:"⛈❄️"
    };
    const nightWeatherIcons = {
      0:"🌙", 1:"🌙", 2:"🌙⛅️", 3:"☁️", 45:"🌫", 48:"🌫", 51:"🌧", 53:"🌧", 55:"🌧",
      56:"🌧❄️", 57:"🌧❄️", 61:"🌧", 63:"🌧", 65:"🌧", 66:"🌧❄️", 67:"🌧❄️",
      71:"❄️", 73:"❄️", 75:"❄️", 77:"❄️", 80:"🌧", 81:"🌧", 82:"🌧",
      85:"❄️", 86:"❄️", 95:"⛈", 96:"⛈❄️", 99:"⛈❄️"
    };
    renderSavedCities();
    cityInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      const query = cityInput.value.trim();
      if (!query) { autocompleteEl.style.display = "none"; return; }
      debounceTimer = setTimeout(() => fetchSuggestions(query), 200);
    });
    cityInput.addEventListener("blur", () => { setTimeout(() => { autocompleteEl.style.display = "none"; }, 200); });
    searchBtn.addEventListener("click", () => {
      const city = cityInput.value.trim();
      if (!city) return;
      fetchCityCoordinates(city);
    });
    autoLocBtn.addEventListener("click", () => {
      if (!navigator.geolocation) { fallbackToIpLocation(); return; }
      showLoading();
      navigator.geolocation.getCurrentPosition(
        pos => reverseGeocode(pos.coords.latitude, pos.coords.longitude),
        err => fallbackToIpLocation()
      );
    });
    async function fetchSuggestions(query) {
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        if (!data.length) { autocompleteEl.style.display = "none"; return; }
        autocompleteEl.innerHTML = "";
        data.forEach(item => {
          const sDiv = document.createElement("div");
          sDiv.className = "suggestion";
          const shortName = makeShortName(item.address) || item.display_name;
          sDiv.textContent = shortName;
          sDiv.addEventListener("click", () => { cityInput.value = shortName; autocompleteEl.style.display = "none"; fetchCityCoordinates(shortName); });
          autocompleteEl.appendChild(sDiv);
        });
        autocompleteEl.style.display = "block";
      } catch(e) { autocompleteEl.style.display = "none"; }
    }
    async function fallbackToIpLocation() {
      showLoading();
      try {
        const res = await fetch("https://ipwho.is/");
        if (!res.ok) throw new Error("IP location request failed");
        const data = await res.json();
        if (!data.success) throw new Error("IP location not available");
        const lat = data.latitude, lon = data.longitude;
        const place = data.city && data.country ? `${data.city}, ${data.country}` : "My Location";
        fetchWeather(lat, lon, place);
      } catch(err) { currentWeatherEl.innerHTML = `<p class="error">${err.message}</p>`; }
    }
    async function fetchCityCoordinates(city) {
      showLoading();
      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(city)}`);
        if (!geoRes.ok) throw new Error("Geocoding request failed");
        const geoData = await geoRes.json();
        if (!geoData.length) throw new Error("City not found");
        const { lat, lon, address } = geoData[0];
        const shortName = makeShortName(address);
        fetchWeather(lat, lon, shortName);
      } catch (err) { currentWeatherEl.innerHTML = `<p class="error">${err.message}</p>`; }
    }
    async function reverseGeocode(lat, lon) {
      try {
        const revRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}`);
        if (!revRes.ok) throw new Error("Reverse geocode failed");
        const revData = await revRes.json();
        const shortName = revData.address ? makeShortName(revData.address) : "Current Location";
        fetchWeather(lat, lon, shortName);
      } catch (err) { currentWeatherEl.innerHTML = `<p class="error">${err.message}</p>`; }
    }
    function makeShortName(addr) {
      const city = addr.city || addr.town || addr.village || addr.county || "";
      const state = addr.state || "";
      const country = addr.country || "";
      const shortArray = [city, state, country].filter(Boolean);
      return shortArray.length ? shortArray.join(", ") : "";
    }
    async function fetchWeather(lat, lon, displayName) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_mean&hourly=temperature_2m,relativehumidity_2m,apparent_temperature,precipitation_probability,winddirection_10m,weathercode&current_weather=true&timezone=auto`;
        const weatherRes = await fetch(url);
        if (!weatherRes.ok) throw new Error("Weather request failed");
        const data = await weatherRes.json();
        displayWeather(data, { lat, lon, displayName });
      } catch (err) { currentWeatherEl.innerHTML = `<p class="error">${err.message}</p>`; }
    }
    function displayWeather(data, cityObj) {
      forecastCardsEl.innerHTML = "";
      hourlyForecastEl.innerHTML = "";
      if (!data.current_weather || !data.daily || !data.hourly) { currentWeatherEl.innerHTML = `<p class="error">Incomplete weather data</p>`; return; }
      const cw = data.current_weather, daily = data.daily, hourly = data.hourly;
      const displayName = cityObj.displayName || "Unknown";
      const currentTime = new Date(cw.time);
      const sunriseTime = new Date(daily.sunrise[0]);
      const sunsetTime = new Date(daily.sunset[0]);
      const isNight = (currentTime < sunriseTime || currentTime > sunsetTime);
      const iconMapping = isNight ? nightWeatherIcons : dayWeatherIcons;
      const todayCode = cw.weathercode;
      const todayIcon = iconMapping[todayCode] || "❓";
      const maxTempToday = daily.temperature_2m_max[0].toFixed(0);
      const minTempToday = daily.temperature_2m_min[0].toFixed(0);
      let hourIndex = hourly.time.findIndex(t => t === cw.time);
      if (hourIndex === -1) {
        const now = new Date(cw.time).getTime();
        let closestDiff = Infinity, closestIndex = 0;
        hourly.time.forEach((ht,i) => { 
          const diff = Math.abs(new Date(ht).getTime() - now);
          if (diff < closestDiff) { closestDiff = diff; closestIndex = i; }
        });
        hourIndex = closestIndex;
      }
      const feelsLike = hourly.apparent_temperature[hourIndex]?.toFixed(0);
      const humidity = hourly.relativehumidity_2m[hourIndex];
      const precipProb = hourly.precipitation_probability[hourIndex];
      const windDir = hourly.winddirection_10m[hourIndex];
      currentWeatherEl.innerHTML = `
        <div class="weather-icon">${todayIcon}</div>
        <div class="temp">${cw.temperature.toFixed(0)}°C</div>
        <div class="conditions">${displayName}</div>
        <div class="range">Max ${maxTempToday}°C - Min ${minTempToday}°C</div>
        <div class="more-info">
          <p>Feels like: ${feelsLike ?? "--"}°C</p>
          <p>Humidity: ${humidity ?? "--"}%</p>
          <p>Precip. Chance: ${precipProb ?? "--"}%</p>
          <p>Wind Dir: ${windDir ?? "--"}°</p>
        </div>
        <button class="library-btn" id="addToLibraryBtn">Add to Library</button>
      `;
      // Build 24-Hour Forecast
      let hourlyCardsHTML = `<h2>24-Hour Forecast</h2><div class="hourly-cards">`;
      const hourlyTimes = hourly.time;
      const hourlyTemps = hourly.temperature_2m;
      const hourlyWeatherCodes = hourly.weathercode;
      const currentHourIndex = hourIndex;
      const endIndex = Math.min(currentHourIndex + 24, hourlyTimes.length);
      for (let i = currentHourIndex; i < endIndex; i++) {
        const hTime = new Date(hourlyTimes[i]);
        const hr = hTime.getHours();
        const period = hr >= 12 ? "PM" : "AM";
        const formattedHour = ((hr % 12) || 12) + period;
        const temp = hourlyTemps[i].toFixed(0);
        // Determine day or night for each hour (simple heuristic: 6-18 = day)
        const icon = (hr >= 6 && hr < 18 ? dayWeatherIcons : nightWeatherIcons)[hourlyWeatherCodes[i]] || "❓";
        hourlyCardsHTML += `
          <div class="hourly-card">
            <div class="hour">${formattedHour}</div>
            <div class="icon">${icon}</div>
            <div class="temp">${temp}°</div>
          </div>
        `;
      }
      hourlyCardsHTML += `</div>`;
      hourlyForecastEl.innerHTML = hourlyCardsHTML;
      // Build 7-Day Forecast
      const days = daily.time, wCodes = daily.weathercode, maxTemps = daily.temperature_2m_max, minTemps = daily.temperature_2m_min;
      days.forEach((day, idx) => {
        const dateObj = new Date(day);
        const dayName = dateObj.toLocaleDateString("en-US",{weekday:"short"});
        const icon = iconMapping[wCodes[idx]] || "❓";
        const max = maxTemps[idx].toFixed(0);
        const min = minTemps[idx].toFixed(0);
        forecastCardsEl.innerHTML += `
          <div class="day-card">
            <div class="day">${dayName}</div>
            <div class="icon">${icon}</div>
            <div class="temps">${max}° / ${min}°</div>
          </div>
        `;
      });
      sunriseTimeEl.textContent = formatTime(daily.sunrise[0]) || "--:--";
      sunsetTimeEl.textContent = formatTime(daily.sunset[0]) || "--:--";
      uvIndexEl.textContent = daily.uv_index_max[0] ? daily.uv_index_max[0] : "--";
      airQualityEl.textContent = "N/A";
      const addBtn = document.getElementById("addToLibraryBtn");
      addBtn.addEventListener("click", () => { addCityToLibrary(cityObj); });
    }
    function showLoading() {
      currentWeatherEl.innerHTML = `<p class="loading">Loading...</p>`;
      forecastCardsEl.innerHTML = "";
      hourlyForecastEl.innerHTML = "";
      sunriseTimeEl.textContent = "--:--";
      sunsetTimeEl.textContent = "--:--";
      uvIndexEl.textContent = "--";
      airQualityEl.textContent = "N/A";
    }
    function formatTime(isoString) {
      const date = new Date(isoString);
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const ampm = hours >= 12 ? "PM" : "AM";
      const hh = hours % 12 || 12;
      const mm = minutes.toString().padStart(2,"0");
      return `${hh}:${mm} ${ampm}`;
    }
    function addCityToLibrary(cityObj) {
      const exists = savedCities.some(c => c.lat === cityObj.lat && c.lon === cityObj.lon);
      if (!exists) {
        savedCities.push({lat: cityObj.lat, lon: cityObj.lon, displayName: cityObj.displayName});
        localStorage.setItem("savedCities", JSON.stringify(savedCities));
        renderSavedCities();
      }
    }
    function renderSavedCities() {
      savedCitiesListEl.innerHTML = "";
      savedCities.forEach((city,i) => {
        const div = document.createElement("div");
        div.className = "saved-city";
        const shortDisplay = city.displayName.length>25 ? city.displayName.slice(0,25)+"…" : city.displayName;
        div.innerHTML = `${shortDisplay}<button class="remove-btn" data-idx="${i}">×</button>`;
        div.addEventListener("click", e => {
          if (e.target.classList.contains("remove-btn")) { e.stopPropagation(); removeCityFromLibrary(e.target.dataset.idx); }
          else { fetchWeather(city.lat, city.lon, city.displayName); }
        });
        savedCitiesListEl.appendChild(div);
      });
    }
    function removeCityFromLibrary(index) {
      savedCities.splice(index,1);
      localStorage.setItem("savedCities", JSON.stringify(savedCities));
      renderSavedCities();
    }
  </script>
</body>
</html>
